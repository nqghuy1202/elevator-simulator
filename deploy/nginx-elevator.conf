# Nginx reverse proxy CHẠY TRÊN CHÍNH VPS (không phải container) — dùng chung VPS đang chạy
# debtcrusher, financal, hlcare, thêm subdomain riêng cho app này. Copy file này vào
# /etc/nginx/sites-available/elevator, symlink sang sites-enabled, rồi chạy
# `sudo certbot --nginx -d elevator.hlcompany.id.vn` — certbot sẽ tự thêm block 443 +
# redirect 80->443 vào đúng file này, không cần sửa tay.
#
# Khác với các app kia: frontend container ở đây phục vụ WebSocket (Socket.IO) nên cần thêm
# 3 dòng proxy_http_version/Upgrade/Connection để cho phép nâng cấp kết nối lên WS -- thiếu
# 3 dòng này Socket.IO vẫn chạy được (rơi về long-polling) nhưng không dùng WebSocket thật.

server {
    listen 80;
    listen [::]:80;
    server_name elevator.hlcompany.id.vn;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
